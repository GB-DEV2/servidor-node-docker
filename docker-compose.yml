version: "3.8"

services:
  app:
    build: .
    container_name: servidor-node
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/meubanco
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: banco-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: